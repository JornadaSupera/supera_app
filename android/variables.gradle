ext {
    // 24, não 22: o Capacitor 8 já exige 24, e o @capgo/capacitor-social-login
    // adiciona androidx.browser:browser:1.9.0 incondicionalmente (usado pelo
    // caminho de fallback da Apple), cuja minSdk é 23. Com 22 o merge de
    // manifesto quebra assim que o plugin entra no build:
    // "uses-sdk:minSdkVersion 22 cannot be smaller than version 23 declared
    // in library [androidx.browser:browser:1.9.0]". Descarta Android 5.1/6.0.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}